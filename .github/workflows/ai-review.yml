# An AI review of a pull request on request, comment only (AI-REVIEW.md): the ai-review label starts it.
# Other repositories call mark1russell7/template/.github/workflows/reusable-ai-review.yml@<commit> # main
name: AI review

on:
  pull_request:
    # Not on each push. The ai-review label starts a review. The other events start a review only with
    # the automatic review (the repository variable AI_REVIEW_AUTO), else they give a notice.
    types: [opened, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    uses: mark1russell7/template/.github/workflows/reusable-ai-review.yml@f05c6eeb35e33a040bdfdcd7d07a1d2c00640f8d # main
    secrets:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
