# A second AI review of each pull request, by an OpenAI model, comment only (CODEX-REVIEW.md).
# Other repositories call mark1russell7/template/.github/workflows/reusable-codex-review.yml@<commit> # main
# Without the OPENAI_API_KEY secret, each run stops at once with a note.
name: AI second opinion

on:
  pull_request:
    # Not on each push: a new review comes from the ai-review label
    types: [opened, reopened, ready_for_review, labeled]

permissions:
  contents: read
  pull-requests: write

jobs:
  codex:
    uses: mark1russell7/template/.github/workflows/reusable-codex-review.yml@dda4a8a70e2a656472d0b649461fe3c6a2bde5b4 # main
    secrets:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
