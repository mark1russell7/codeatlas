# Scans each public repository with a new head again, every 3 hours (CA21 of docs/ROADMAP.md). `git ls-remote` gives
# the heads with no clone. The job clones only the changed repositories and the template, and scans them into the
# catalog of the last run. The freshness gate fails when a head waits 6 hours or more for the index.
# The workflow "Catalog" stays the full scan: each push to main, each pull request and each week.
name: Fresh index

on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions: {}

# Two runs of this workflow must not write the catalog at the same time
concurrency:
  group: catalog-fresh
  cancel-in-progress: false

jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The newest database of main, from this workflow or from the workflow "Catalog"
      - name: Restore the catalog of the last run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/catalog.sqlite
          key: catalog-${{ github.run_id }}
          restore-keys: catalog-
      # A repository that is not public now leaves the catalog before the scan and before the save of the cache
      - name: Remove the repositories that are not public now
        id: prune
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node packages/atlas/src/cli.ts prune --db "$RUNNER_TEMP/catalog.sqlite" --owner "$GITHUB_REPOSITORY_OWNER" 2>&1 | tee "$RUNNER_TEMP/prune.txt"
          removed=$(sed -n 's/.*, \([0-9]*\) removed from the catalog.*/\1/p' "$RUNNER_TEMP/prune.txt")
          echo "removed=${removed:-0}" >> "$GITHUB_OUTPUT"
      # The repositories with a head that the catalog does not have. With no catalog, each repository is one
      - name: Changed repositories
        id: changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node packages/atlas/src/cli.ts fresh --owner "$GITHUB_REPOSITORY_OWNER" --db "$RUNNER_TEMP/catalog.sqlite" --changed "$RUNNER_TEMP/changed.txt"
          count=$(wc -l < "$RUNNER_TEMP/changed.txt" | tr -d ' ')
          echo "count=$count" >> "$GITHUB_OUTPUT"
          { echo "Changed repositories: $count"; echo; } >> "$GITHUB_STEP_SUMMARY"
      # The template always comes with them: the scan reads the list of its stamp, and the drift reads its pins
      - name: Clone the changed repositories
        if: steps.changed.outputs.count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/atlas/src/cli.ts clone --owner "$GITHUB_REPOSITORY_OWNER" --into "$RUNNER_TEMP/repos" --only "$RUNNER_TEMP/changed.txt"
      - name: Install the packages of the template
        if: steps.changed.outputs.count != '0'
        run: pnpm install --frozen-lockfile --ignore-scripts --dir "$RUNNER_TEMP/repos/template"
      - name: Scan into the catalog
        if: steps.changed.outputs.count != '0'
        run: |
          set -euo pipefail
          node packages/atlas/src/cli.ts catalog --repos-dir "$RUNNER_TEMP/repos" --out "$RUNNER_TEMP/catalog.sqlite" --markdown "$RUNNER_TEMP/catalog.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/catalog.md"
      - name: Save the catalog for the next run
        if: steps.changed.outputs.count != '0' || steps.prune.outputs.removed != '0'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/catalog.sqlite
          key: catalog-${{ github.run_id }}
      # After the scan, each head must be in the index, or wait less than 6 hours. The step writes the delay of the week
      - name: Freshness gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          node packages/atlas/src/cli.ts fresh --owner "$GITHUB_REPOSITORY_OWNER" --db "$RUNNER_TEMP/catalog.sqlite" --markdown "$RUNNER_TEMP/fresh.md" --out "$RUNNER_TEMP/fresh.json" --gate
          status=$?
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/fresh.md"
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: fresh
          path: ${{ runner.temp }}/fresh.json
          retention-days: 14
          if-no-files-found: warn
