# Builds the atlas and the site, and publishes them to GitHub Pages at https://mark1russell7.github.io/codeatlas/,
# with the shared Pages workflow of mark1russell7 (reusable-pages.yml of mark1russell7/template, its CI.md).
# The build clones each public repository of the owner, scans it, and writes the atlas (data/atlas.json,
# data/atlas.md) and the page that shows it. It also counts the corpus, builds the Layer 1a catalog, adds its point to the trend (data/trend.json), and writes the answers of the query set (data/queries.json). The schedule makes a new atlas each Monday. The stamps name the run
# and the limit of the data, and the freshness gate reads them before the deploy.
# The Pages source of the repository is "GitHub Actions" (Settings > Pages).
name: Pages

on:
  push:
    branches: [main]
  # A pull request builds the site and runs the site check, with no deploy.
  pull_request:
  schedule:
    - cron: "40 6 * * 1"
  workflow_dispatch:

permissions: {}

# One deployment at a time. A newer push cancels a deployment that waits.
# Each pull request has its own group, so it does not cancel a deployment.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pages:
    uses: mark1russell7/template/.github/workflows/reusable-pages.yml@e077054e0f2ebb8441e4bc525b56cf2acc2afb6f # main
    # The build job of the shared workflow gets only the read permissions. Only its deploy job,
    # which runs no code of the repository, writes to Pages.
    permissions:
      contents: read
      actions: read
      issues: read
      pull-requests: read
      checks: read
      statuses: read
      pages: write
      id-token: write
    with:
      # gh lists the public repositories with the token of the run (read permissions only).
      github-token: true
      build: |
        node packages/atlas/src/cli.ts clone --owner "$GITHUB_REPOSITORY_OWNER" --into "$RUNNER_TEMP/repos"
        node packages/atlas/src/cli.ts build --repos-dir "$RUNNER_TEMP/repos" --out "$RUNNER_TEMP/atlas.json" --markdown "$RUNNER_TEMP/atlas.md"
        node packages/site/src/build.ts --atlas "$RUNNER_TEMP/atlas.json" --markdown "$RUNNER_TEMP/atlas.md" --out packages/site/dist
        node packages/atlas/src/cli.ts corpus --repos-dir "$RUNNER_TEMP/repos" --out packages/site/dist/data/corpus.json --markdown "$RUNNER_TEMP/corpus.md"
        # Layer 1a: the catalog of the facts of each blob. The command fails when a hash breaks the law of the chain.
        node packages/atlas/src/cli.ts catalog --repos-dir "$RUNNER_TEMP/repos" --out "$RUNNER_TEMP/catalog.sqlite" --markdown "$RUNNER_TEMP/facts.md"
        # The trend: the file of the last deploy, with the point of this build. Only a first deploy has no file (404).
        # Each other failure stops the build, so a build does not lose the history.
        code=$(curl -sS -o "$RUNNER_TEMP/trend.json" -w '%{http_code}' https://mark1russell7.github.io/codeatlas/data/trend.json) || code=000
        case "$code" in
          200) node packages/atlas/src/cli.ts trend --db "$RUNNER_TEMP/catalog.sqlite" --previous "$RUNNER_TEMP/trend.json" --out packages/site/dist/data/trend.json ;;
          404) echo "::warning::The site has no trend: the trend starts with this build."
               node packages/atlas/src/cli.ts trend --db "$RUNNER_TEMP/catalog.sqlite" --out packages/site/dist/data/trend.json ;;
          *) echo "::error::The trend of the site gave HTTP $code."; exit 1 ;;
        esac
        # The query set: the duplication of each level, the exact copies, the complex functions and the markers.
        node packages/atlas/src/cli.ts queries --db "$RUNNER_TEMP/catalog.sqlite" --out packages/site/dist/data/queries.json
        cat "$RUNNER_TEMP/atlas.md" "$RUNNER_TEMP/corpus.md" "$RUNNER_TEMP/facts.md" >> "$GITHUB_STEP_SUMMARY"
      out: packages/site/dist
      timeout-minutes: 30
      site-pages: true
      site-name: codeatlas
      roadmap: docs/ROADMAP.md
      # The site check: a browser opens each page at 360, 400 and 1280 px, in light and dark, before the deploy.
      # A failure stops the deploy.
      site-check: true
      site-check-pages: /,/releases/,/status/
      # The probe drives the filters of the atlas on the home page. The check reads the TypeScript source and removes its types.
      site-check-probe: packages/site/src/check-probe.ts
      # The gate reads these stamps, and its schedule rule reads the cron line of this file.
      data-stamps: packages/site/dist/data-stamps.json
      deploy: ${{ github.event_name != 'pull_request' }}

  # This job examines the deployed site: the page, the atlas data and the pages of site-pages.
  # It starts no code of the repository and reads only the public site.
  served:
    needs: pages
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: The site has the page and its data
        shell: bash
        env:
          SITE: ${{ needs.pages.outputs.page-url }}
        run: |
          set -euo pipefail
          for f in "" data-stamps.json data/atlas.json data/atlas.md data/trend.json data/releases.json data/status.json releases/ status/; do
            # A new deployment can take some seconds to be served, so each file gets 5 tries.
            ok=0
            for i in 1 2 3 4 5; do
              if curl -fsS -o /dev/null "${SITE%/}/$f"; then ok=1; break; fi
              sleep 10
            done
            if [ "$ok" != 1 ]; then echo "::error::The site has no /$f."; exit 1; fi
            echo "The site has /$f."
          done
          curl -fsS "${SITE%/}/data/atlas.json" | node -e '
            const a = JSON.parse(require("node:fs").readFileSync(0, "utf8"));
            if (a.schema !== "codeatlas/1" || !(a.totals.repos > 0)) { console.error("data/atlas.json is not an atlas."); process.exit(1); }
            console.log(`data/atlas.json: ${a.totals.repos} repositories, ${a.totals.crossRepoClasses} cross-repo classes.`);
          '
