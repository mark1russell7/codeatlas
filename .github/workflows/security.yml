# The security scans of this repository (the action security-scan, CI.md, Security): dependency review,
# osv-scanner and CodeQL, in one job. A pull request fails only for a new finding at or above high.
# Other repositories use mark1russell7/template/.github/actions/security-scan@<commit> # main
name: Security

on:
  pull_request:
  push:
    branches: [main]
  # A weekly scan finds the new advisories for the dependencies that do not change
  schedule:
    - cron: "56 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  security-ok:
    name: Security OK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - uses: mark1russell7/template/.github/actions/security-scan@e077054e0f2ebb8441e4bc525b56cf2acc2afb6f # main
