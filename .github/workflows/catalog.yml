# Builds the catalog database (Layer 1a of docs/SCHEMA.md) over each public repository of the owner.
# The job restores the database of the last run of main, so the scan parses only new blobs. It writes the
# summary (counts, time, clone classes, the law of the chain) to the step summary. It keeps the database as an artifact.
# A pull request builds the catalog from the cache of main and saves no cache.
name: Catalog

on:
  push:
    branches: [main]
    paths:
      - "packages/atlas/**"
      - "packages/precision/**"
      - ".github/workflows/catalog.yml"
      - "labels/finds-1.jsonl"
      - "labels/formulas-1.jsonl"
  # Each pull request starts this workflow, so its summary check is always there. The job changes skips the
  # work when the pull request changes no file of the gate (CI.md of the template, "A gate with paths").
  pull_request:
  schedule:
    - cron: "36 7 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: catalog-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      match: ${{ steps.changes.outputs.match }}
    steps:
      - id: changes
        uses: mark1russell7/template/.github/actions/changes@d20d75b11120af71eaf6d2f59385c9cd053fff8b # main
        with:
          paths: |
            packages/atlas/**
            packages/precision/**
            .github/workflows/catalog.yml
            labels/finds-1.jsonl
            labels/formulas-1.jsonl

  catalog:
    needs: changes
    if: needs.changes.outputs.match == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # The coverage step reads the CI artifacts of the public repositories
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The newest database of main. A new schema or facts version makes the scan parse each blob again.
      - name: Restore the catalog of the last run
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/catalog.sqlite
          key: catalog-${{ github.run_id }}
          restore-keys: catalog-
      - name: Clone the public repositories
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/atlas/src/cli.ts clone --owner "$GITHUB_REPOSITORY_OWNER" --into "$RUNNER_TEMP/repos"
      # The restored catalog can have a repository that is now private, archived or deleted. Its facts go before the scan.
      - name: Remove the repositories that are not public now
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packages/atlas/src/cli.ts prune --db "$RUNNER_TEMP/catalog.sqlite" --owner "$GITHUB_REPOSITORY_OWNER"
      # The scan starts "stamp --check" of the template on each repository, and the stamp imports packages of the template
      - name: Install the packages of the template
        run: pnpm install --frozen-lockfile --ignore-scripts --dir "$RUNNER_TEMP/repos/template"
      # The command fails when a hash breaks the law of the chain, or when it reads no repository or no function.
      # Each file that the parser cannot read gets a warning annotation with its name: a "no read" is not a pass.
      - name: Scan into the catalog
        run: |
          set -euo pipefail
          node packages/atlas/src/cli.ts catalog --repos-dir "$RUNNER_TEMP/repos" --out "$RUNNER_TEMP/catalog.sqlite" --markdown "$RUNNER_TEMP/catalog.md"
          ls -l "$RUNNER_TEMP/catalog.sqlite" | awk '{ printf "Database: %.1f MB\n\n", $5 / 1000000 }' | tee -a "$GITHUB_STEP_SUMMARY"
          # The log has the summary too, so that gh run view --log reads it
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/catalog.md"
      # A second scan of the same commits parses nothing: the determinism of the cache
      - name: Scan again from the cache
        run: |
          set -euo pipefail
          node packages/atlas/src/cli.ts catalog --repos-dir "$RUNNER_TEMP/repos" --out "$RUNNER_TEMP/catalog.sqlite" --markdown "$RUNNER_TEMP/again.md" 2>&1 | tee "$RUNNER_TEMP/again.log"
          grep -q " 0 parsed," "$RUNNER_TEMP/again.log" || { echo "::error::The second scan parsed blobs again."; exit 1; }
      # The pin age and its gate, with the pin freshness, the stamp freshness and the pin lag as readings
      - name: Drift from the template
        run: |
          set -euo pipefail
          node packages/atlas/src/cli.ts drift --db "$RUNNER_TEMP/catalog.sqlite" --markdown "$RUNNER_TEMP/drift.md" --out "$RUNNER_TEMP/drift.json"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/drift.md"
      # The rules of the conventions that each repository breaks
      - name: Conventions breaks
        run: |
          set -euo pipefail
          node packages/atlas/src/cli.ts breaks --db "$RUNNER_TEMP/catalog.sqlite" --markdown "$RUNNER_TEMP/breaks.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/breaks.md"
      # The coverage of the tests: the coverage artifacts of the CI of each repository, read into the catalog
      - name: Coverage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node packages/atlas/src/cli.ts coverage --db "$RUNNER_TEMP/catalog.sqlite" --owner "$GITHUB_REPOSITORY_OWNER" --dir "$RUNNER_TEMP/coverage" --markdown "$RUNNER_TEMP/coverage.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/coverage.md"
      # Two roadmap items in two repositories that plan the same thing (CA5)
      - name: Planned duplication
        run: |
          set -euo pipefail
          node packages/atlas/src/cli.ts planned --db "$RUNNER_TEMP/catalog.sqlite" --out "$RUNNER_TEMP/planned.json" --markdown "$RUNNER_TEMP/planned.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/planned.md"
      # The value of each dimension for each function and each file (CA20)
      - name: Dimensions
        run: |
          set -euo pipefail
          node packages/atlas/src/cli.ts dimensions --db "$RUNNER_TEMP/catalog.sqlite" --out "$RUNNER_TEMP/dimensions.json" --markdown "$RUNNER_TEMP/dimensions.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/dimensions.md"
      # The values of the dimensions against independent tools, on a seeded sample of the index (CA20)
      - name: Precision of the dimensions
        run: |
          set -euo pipefail
          node packages/precision/src/cli.ts --index "$RUNNER_TEMP/dimensions.json" --repos-dir "$RUNNER_TEMP/repos" --db "$RUNNER_TEMP/catalog.sqlite" --out "$RUNNER_TEMP/precision.json" --markdown "$RUNNER_TEMP/precision.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/precision.md"
      # One formula skeleton in two repositories or more: leads for the owners (CA15)
      - name: Formula skeletons
        run: |
          set -euo pipefail
          node packages/atlas/src/cli.ts formulas --db "$RUNNER_TEMP/catalog.sqlite" --finds labels/finds-1.jsonl --verdicts labels/formulas-1.jsonl --out "$RUNNER_TEMP/formulas.json" --markdown "$RUNNER_TEMP/formulas.md"
          tee -a "$GITHUB_STEP_SUMMARY" < "$RUNNER_TEMP/formulas.md"
      - name: Save the catalog for the next run
        if: github.event_name != 'pull_request'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/catalog.sqlite
          key: catalog-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog
          path: |
            ${{ runner.temp }}/catalog.sqlite
            ${{ runner.temp }}/planned.json
            ${{ runner.temp }}/formulas.json
            ${{ runner.temp }}/dimensions.json
            ${{ runner.temp }}/precision.json
            ${{ runner.temp }}/drift.json
          retention-days: 14
          if-no-files-found: error
      # The gate of the pin age: the p90 of the repositories is at most 3 days. It runs after the save of the catalog,
      # so a fail keeps the catalog. A pull request does not change the pins of other repositories, so it skips the gate.
      - name: Pin age gate
        if: github.event_name != 'pull_request'
        run: node packages/atlas/src/cli.ts drift --db "$RUNNER_TEMP/catalog.sqlite" --gate

  catalog-ok:
    name: Catalog OK
    if: ${{ !cancelled() }}
    needs: [changes, catalog]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@d20d75b11120af71eaf6d2f59385c9cd053fff8b # main
        with:
          needs: ${{ toJSON(needs) }}
