# The CI of this repository. The job ci is the shared CI of mark1russell7 (reusable-ci.yml, CI.md)
# with its default inputs: it runs each standard script that package.json has (format:check,
# typecheck, lint, check:conventions, test, build in each package that has it, check:boundaries, check:api and lint:ste).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:
  # A person starts a run on a branch with no pull request: gh workflow run ci.yml --ref <branch>
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: mark1russell7/template/.github/workflows/reusable-ci.yml@afc3a844abdf898aa6439835fbde1c49a0566e17 # main

  # Each preset of `pnpm package add` makes a package, and that package passes its typecheck and its tests.
  # The tests of the preset service hold its entry to describe() and lint() of @mark1russell7/service (OTH-5).
  # A test of the CLI compares this list with the presets of the CLI.
  # Only the template has the source of the CLI (packages/cli), so a repository from new-repo.ps1 skips this job.
  presets:
    if: github.repository == 'mark1russell7/template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        preset: [node, node-cjs, ts, vite, react, service]
    env:
      PACKAGE: demo-${{ matrix.preset }}
      PRESET: ${{ matrix.preset }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm package add "$PACKAGE" --preset="$PRESET"
      # The new package changes the lockfile
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm --filter "@template/$PACKAGE" typecheck
      - run: pnpm --filter "@template/$PACKAGE" test

  # The site of .github/site.json: the build, the site check and the probe, with no deploy (CI.md of the
  # template, "The site config"). The Pages workflow deploys the same site from main.
  site:
    uses: mark1russell7/template/.github/workflows/reusable-pages-check.yml@afc3a844abdf898aa6439835fbde1c49a0566e17 # main
    permissions:
      contents: read
    with:
      timeout-minutes: 30

  # The summary check of the ruleset of main: each job passed (CI.md of the template, "The check of the
  # ruleset").
  ci-ok:
    name: CI OK
    if: ${{ !cancelled() }}
    needs: [ci, presets, site]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - uses: mark1russell7/template/.github/actions/gate-summary@afc3a844abdf898aa6439835fbde1c49a0566e17 # main
        with:
          needs: ${{ toJSON(needs) }}
          # The jobs that their own if can skip. Each other job must pass.
          allow-skip: "presets"
