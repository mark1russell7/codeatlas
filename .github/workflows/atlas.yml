# The duplication atlas of all the public repositories of the owner (fleet direction 16).
# The job clones each public repository that is not a fork and not archived, scans it, and writes the
# atlas as JSON and as Markdown: an artifact of the run, and the summary of the run.
name: Atlas

on:
  workflow_dispatch:
    inputs:
      min-nodes:
        description: The smallest function shape that counts, in syntax nodes.
        type: string
        default: "40"
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: atlas
  cancel-in-progress: false

jobs:
  atlas:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Clone the public repositories
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          mkdir -p "$RUNNER_TEMP/repos"
          gh repo list "$OWNER" --visibility public --no-archived --source --limit 1000 --json name --jq '.[].name' | sort > "$RUNNER_TEMP/repos.txt"
          echo "$(wc -l < "$RUNNER_TEMP/repos.txt") public repositories"
          while read -r repo; do
            git clone --quiet --depth 1 "https://github.com/$OWNER/$repo.git" "$RUNNER_TEMP/repos/$repo" || echo "::warning::$repo did not clone"
          done < "$RUNNER_TEMP/repos.txt"

      - name: Build the atlas
        env:
          MIN_NODES: ${{ inputs.min-nodes || '40' }}
        run: |
          mkdir -p atlas
          node packages/atlas/src/cli.ts build --repos-dir "$RUNNER_TEMP/repos" --min-nodes "$MIN_NODES" --out atlas/atlas.json --markdown atlas/atlas.md
          cat atlas/atlas.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas
          path: atlas/
          retention-days: 90
